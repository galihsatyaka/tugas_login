<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="form-box">
            <h2>Form Login</h2>
            <form>
                <input type="email" placeholder="Masukkan email" aria-label="Email" required>
                <input type="password" placeholder="Masukkan password" aria-label="Password" required>
                <p><a href="#">Lupa Password?</a></p>
                <button type="submit">Login</button>
            </form>
            <p>Belum punya akun? <a href="no1_signup.html">Daftar</a></p>
        </section>
    </main>
</body>
</html>
